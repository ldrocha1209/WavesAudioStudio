[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "waves-engine-poc"
version = "0.0.1"
description = "Disposable Phase 0 processing-engine proof for Waves"
requires-python = ">=3.11,<3.12"
dependencies = [
  "demucs==4.0.1",
  "numpy==1.26.4",
  "pyinstaller==6.16.0",
  "soundfile==0.13.1",
  "torch==2.2.2",
  "torchaudio==2.2.2",
  "yt-dlp[default]==2026.8.19",
]

[project.scripts]
waves-engine = "waves_engine.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["waves_engine*"]
